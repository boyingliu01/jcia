name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint / Type / Security / Arch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check jcia tests

      - name: Ruff import-sort check
        run: python -m ruff check --select I jcia tests

      - name: Ruff format check
        run: python -m ruff format --check jcia tests

      # scripts/ predates the lint config and is not swept wholesale, but the
      # two release guards gate PyPI publishing: they hold the same bar as
      # jcia/tests, enforced file-scoped instead of directory-wide.
      - name: Ruff lint (release guards)
        run: python -m ruff check scripts/check_dist_placeholders.py scripts/check_wheel_assets.py

      - name: Ruff format check (release guards)
        run: python -m ruff format --check scripts/check_dist_placeholders.py scripts/check_wheel_assets.py

      - name: Architecture contracts (import-linter)
        run: lint-imports

      - name: Type check (pyright)
        run: python -m pyright jcia tests scripts/check_dist_placeholders.py scripts/check_wheel_assets.py

      - name: Type check (mypy)
        run: python -m mypy jcia tests scripts/check_dist_placeholders.py scripts/check_wheel_assets.py

      - name: Security scan (bandit)
        run: python -m bandit -r jcia -c pyproject.toml

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests with coverage
        run: >-
          python -m pytest tests/unit -v
          --cov=jcia --cov-report=term-missing --cov-report=xml
          --cov-fail-under=80

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  # Standalone blocking job (deliberately not a step of the non-blocking
  # integration job): the wheel asset guard's real-artifact path otherwise
  # first runs at tag push (release.yml), so this builds both artifacts and
  # exercises the guard on every regular CI run. Blocking + standalone means a
  # packaging regression turns the PR red (~1 min) instead of blocking a
  # release, and the signal can be neither muted by job-level
  # continue-on-error nor skipped by fail-fast of earlier steps.
  packaging:
    name: Packaging (wheel asset guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python 3.12 mirrors the lint job and provides tomllib (3.11+); the
      # guard otherwise needs only `build`, so a version matrix adds no signal.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet build

      - name: Build artifacts and smoke the wheel asset guard
        run: |
          python -m build
          python scripts/check_wheel_assets.py

  integration:
    name: Integration tests (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run integration tests
        run: python -m pytest tests/integration -v
