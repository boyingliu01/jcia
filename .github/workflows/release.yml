name: Release

on:
  push:
    tags:
      - "v[0-9]*"

# Least privilege by default; each job elevates only what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & verify distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guard tag matches project version
        env:
          REF: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re, sys, tomllib
          ref = os.environ["REF"]
          tag = ref[1:] if ref.startswith("v") else ref
          with open("pyproject.toml", "rb") as f:
              ver = tomllib.load(f)["project"]["version"]
          src = open("jcia/__init__.py", encoding="utf-8").read()
          m = re.search(r"__version__\s*=\s*[\"']([^\"']+)[\"']", src)
          init_ver = m.group(1) if m else None
          errs = []
          if tag != ver:
              errs.append(f"tag {ref} != pyproject {ver}")
          if init_ver != ver:
              errs.append(f"jcia.__version__ {init_ver!r} != pyproject {ver}")
          if errs:
              sys.exit("release blocked: " + "; ".join(errs))
          print(f"version guard OK: tag == pyproject == jcia.__version__ == {ver}")
          PY
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      # build/lib and *.egg-info are setuptools incremental caches: a module
      # deleted from the source tree can survive there and keep being packed
      # into the next wheel (the stale-cache vector). On a fresh CI checkout
      # the caches are absent (both are gitignored), so this step is defensive
      # redundancy; it matters when the workspace is reused (local runs,
      # cached runners). The wheel asset guard below stays the exit-side
      # backstop either way. Glob semantics: the runner default shell is bash;
      # when the *.egg-info pattern matches nothing the literal is passed
      # through, and -f turns that into a no-op, so the step always succeeds.
      - name: Clean stale incremental caches
        run: rm -rf build *.egg-info
      - name: Build sdist and wheel
        run: python -m build
      - name: Validate distributions
        run: twine check dist/*
      # Placeholders such as example[.]org become permanent once the release is
      # public: the README reaches the PyPI page via METADATA's long_description
      # and cannot be edited afterwards (a yank keeps history). twine check does
      # not catch it, and Gate MW cannot either -- it only diffs commits.
      - name: Guard distribution against placeholder contacts
        run: python scripts/check_dist_placeholders.py
      # setuptools packages only .py modules by default: a non-.py resource that
      # is undeclared in [tool.setuptools.package-data] -- or silently skipped
      # by its glob (dot files such as .gitkeep) -- is dropped from the wheel
      # with no warning from build or twine check. This guard asserts every
      # declared resource file actually made it into the wheel.
      - name: Guard wheel against missing package resources
        run: python scripts/check_wheel_assets.py
      - name: Smoke test installed artifact
        env:
          REF: ${{ github.ref_name }}
        run: |
          python -m venv _smoke
          ./_smoke/bin/python -m pip install --quiet dist/*.whl
          out="$(./_smoke/bin/jcia --version)"
          echo "$out"
          ver="${REF#v}"
          case "$out" in
            *"$ver"*) echo "installed CLI reports ${ver}" ;;
            *) echo "installed --version does not report ${ver}"; exit 1 ;;
          esac
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Irreversible step runs FIRST: a public GitHub Release is only cut once the
  # package is actually installable from PyPI (avoids a release pointing at an
  # unpublished version). Requires the trusted publisher registered on PyPI.org
  # for this repo + environment "pypi".
  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC token for trusted publishing
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
          run-id: ${{ github.run_id }}
      - name: Publish to PyPI (trusted publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Upstream default is "false". Without it, re-running a succeeded
          # release run dies on HTTP 409, and because github-release needs this
          # job it never executes again -- leaving PyPI published but the GitHub
          # Release missing with no UI-reachable recovery path.
          skip-existing: "true"

  github-release:
    name: Create GitHub Release
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/update the release
    steps:
      - uses: actions/checkout@v4
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
          run-id: ${{ github.run_id }}
      - name: Create or update release with artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=(--title "$GITHUB_REF_NAME" --generate-notes)
          case "$GITHUB_REF_NAME" in
            *-alpha*|*-beta*|*-rc*|*pre*|*dev*) FLAGS+=(--prerelease) ;;
            *) FLAGS+=(--latest) ;;
          esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release exists; refreshing assets"
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* "${FLAGS[@]}"
          fi
