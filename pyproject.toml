[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jcia"
version = "0.1.0"
description = "Java Code Impact Analyzer - 代码变更影响分析工具"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "JCIA Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "pydriller>=2.6.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.2",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "pyright>=1.1.340",
    "bandit[toml]>=1.7.6",
    "pre-commit>=3.6.0",
    "mypy>=1.7.0",
]
ai = [
    "openai>=1.0.0",
]

[project.scripts]
jcia = "jcia.cli.main:cli"

[project.urls]
Homepage = "https://github.com/your-org/jcia"
Documentation = "https://github.com/your-org/jcia#readme"
Repository = "https://github.com/your-org/jcia"
Issues = "https://github.com/your-org/jcia/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["jcia*"]
exclude = ["tests*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "C4",   # flake8-comprehensions
    "S",    # flake8-bandit (security)
    "A",    # flake8-builtins
    "ARG",  # flake8-unused-arguments
    "COM",  # flake8-commas
    "DTZ",  # flake8-datetimez
    "EM",   # flake8-errmsg
    "EXE",  # flake8-executable
    "FA",   # flake8-future-annotations
    "FBT",  # flake8-boolean-trap
    "FIX",  # flake8-fixme
    "FLY",  # flynt
    "G",    # flake8-logging-format
    "ICN",  # flake8-import-conventions
    "INP",  # flake8-no-pep420
    "INT",  # flake8-gettext
    "ISC",  # flake8-implicit-str-concat
    "LOG",  # flake8-logging
    "PERF", # perflint
    "PGH",  # pygrep-hooks
    "PIE",  # flake8-pie
    "PL",   # pylint
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "PYI",  # flake8-pyi
    "Q",    # flake8-quotes
    "RET",  # flake8-return
    "RSE",  # flake8-raise
    "RUF",  # ruff-specific rules
    "SLF",  # flake8-self
    "SLOT", # flake8-slots
    "T10",  # flake8-debugger
    "T20",  # flake8-print
    "TD",   # flake8-todos
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "YTT",  # flake8-2020
]
ignore = [
    "S101",   # assert statements (used in tests)
    "S603",   # subprocess calls (intentional)
    "S607",   # subprocess calls (intentional)
    "COM812", # missing trailing comma (conflicts with formatter)
    "ISC001", # implicit string concatenation (conflicts with formatter)
    "ARG001", # unused function arguments (common in overrides)
    "ARG002", # unused method arguments (common in overrides)
    "PLR0913",# too many arguments (common in complex classes)
    "PLR2004",# magic value comparison (too strict)
    "TRY003", # long messages outside exception class
    "EM101",  # raw string in exception
    "EM102",  # f-string in exception
    "FIX002", # todo comments (we want these)
    "TD003",  # missing issue link in todo
    "FBT001", # boolean positional arg (common pattern)
    "FBT002", # boolean default arg (common pattern)
    "PLW2901",# redefined loop variable (common pattern)
    "RUF012", # mutable class variables (common with dataclasses)
    "RUF002", # fullwidth unicode chars (intentional in Chinese codebase)
    "RUF003", # ambiguous unicode in comments (intentional)
    "RUF001", # ambiguous unicode in string literals (intentional)
    "G004",   # logging f-string (style preference, not correctness)
    "COM812", # missing trailing comma (conflicts with formatter)
    "PLC0415",# import not at top level (lazy imports are intentional)
    "TRY300", # else after return in try (style preference)
    "TRY301", # simplify try/except (style preference)
    "PTH123", # use pathlib.open (style preference)
    "DTZ005", # datetime.now() without tz (existing code pattern)
    "DTZ901", # datetime timezone (paired with DTZ005)
    "PERF401",# list comprehension suggestion (existing code pattern)
    "PERF203",# try-except in loop (intentional for per-item handling)
    "C901",   # function too complex (legacy code)
    "PLR0912",# too many branches (legacy code)
    "PLR0915",# too many locals (legacy code)
    "N817",   # CamelCase imported as non-CamelCase alias (existing pattern)
    "E501",   # line too long (docstrings and long strings)
    "ISC001", # implicit string concatenation (conflicts with formatter)
    "TRY002", # create custom exception (AnalysisError needs to exist first)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "E501",  # line too long (test data/paths)
    "E402",  # module import not at top (sys.path manipulation)
    "S108",  # hardcoded temp file (intentional in tests)
    "SLF001", # private member access (needed for testing)
    "PLC0415", # import not at top level (fixtures/imports)
    "INP001", # implicit namespace package (tests don't need packages)
    "T201",  # print statements (debug output in tests)
    "F401",  # unused imports (test fixtures/fixtures)
    "RET504",# else after return (style preference)
    "S106",  # hardcoded password (test fixtures)
    "RUF015",# prefer next() (style preference)
    "PYI036",# pyi rules not relevant
    "ARG005",# unused function args (test fixtures)
    "RUF059",# unused assignments
    "PT018",  # pytest assertions spanning multiple lines
    "DTZ001", # datetime without timezone (test fixtures)
    "TRY400", # use logger.exception (test fixtures)
    "S105",  # hardcoded password (test fixtures)
    "PYI034",# pyi rules not relevant
    "PTH201",# pathlib rules
    "PGH003",# global noqa (not relevant)
    "F403",  # star imports
]
"jcia/adapters/tools/remote_call/**" = [
    "RUF002",  # Chinese docstrings
    "RUF003",  # Chinese comments
]
"jcia/adapters/tools/__init__.py" = [
    "F401",  # re-exports
]
"jcia/core/use_cases/__init__.py" = [
    "F401",  # re-exports
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
include = ["jcia", "tests"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.git",
    "**/build",
    "**/dist",
    "**/tests/performance/**",
    "**/tests/integration/**",
]
reportMissingTypeStubs = true
reportUnnecessaryIsInstance = true
reportUnnecessaryCast = true
reportUnnecessaryComparison = true
reportInvalidStubStatement = true
reportIncompleteStub = true
reportUnusedExpression = true
reportMatchNotExhaustive = true
# Suppress unknown type reporting - requires extensive type annotations
reportUnknownMemberType = false
reportUnknownVariableType = false
reportMissingParameterType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportMissingReturnType = false




[tool.coverage.run]
source = ["jcia"]
omit = [
    "*/tests/*",
    "*/test_*",
    "jcia/__main__.py",
    "jcia/core/interfaces/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv", ".git", "build", "dist"]
skips = ["B101", "B404", "B405", "B603", "B607", "B310", "B324"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
